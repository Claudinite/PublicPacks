name: promote-packs

# Rewrites pack index entries, and the catalog with them, on the `vendored` branch and then on R2:
# daily, promotes the canary versions out for 72 hours that no release-blocker issue names
# (tools/release/blockers.json); on dispatch with a pack and version, promotes or revokes that one
# entry. docs/release.md.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: promote or revoke the version below; with no pack, run the daily promotion
        type: choice
        options: [promote, revoke]
        default: promote
      pack:
        description: pack id, for example basics
        type: string
        required: false
      version:
        description: the version to promote or revoke
        type: string
        required: false

concurrency:
  group: release-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Soak
        if: ${{ !inputs.pack }}
        run: node tools/release/release.mjs soak --out "$RUNNER_TEMP/soaked.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: No blocker
        if: ${{ !inputs.pack }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/release.mjs no-blocker --candidates "$RUNNER_TEMP/soaked.json" --out "$RUNNER_TEMP/unblocked.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Promote
        env:
          PACKS_KEY: ${{ secrets.CN_PACKS_KEY }}
          PACKS_CERT: ${{ secrets.CN_PACKS_CERT }}
          ACTION: ${{ inputs.action }}
          PACK: ${{ inputs.pack }}
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$PACKS_KEY" ] || [ -z "$PACKS_CERT" ]; then
            echo "::error::the release environment must hold both CN_PACKS_KEY and CN_PACKS_CERT"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PACKS_KEY" > "$RUNNER_TEMP/packs.key"
          printf '%s\n' "$PACKS_CERT" > "$RUNNER_TEMP/packs.cert.json"
          signing=(--key "$RUNNER_TEMP/packs.key" --cert "$RUNNER_TEMP/packs.cert.json")
          if [ -n "$PACK" ]; then
            node tools/release/release.mjs "$ACTION" --pack "$PACK" --version "$VERSION" --by "$ACTOR" --roots keys/roots --summary "$GITHUB_STEP_SUMMARY" "${signing[@]}"
          else
            node tools/release/release.mjs promote --candidates "$RUNNER_TEMP/unblocked.json" --roots keys/roots --summary "$GITHUB_STEP_SUMMARY" "${signing[@]}"
          fi

  upload:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Upload to R2 and read back through the CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/release.mjs upload --r2 claudinite-packs --roots keys/roots --remote origin --summary "$GITHUB_STEP_SUMMARY"
