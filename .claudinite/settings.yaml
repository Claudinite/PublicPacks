engine:
  channel: "staging"
  version: "1.61014.2"
  manifest: "sha512-95gKLETpfQVkZj/gXVx0+sorJuMdvnuPkKyh/k9bymYsoJ41noIrsb9u40hqUzilGWvnz1NPlqPBXdFbFXu0Ag=="
packs:
  channel: "canary"
  declared:
    - "basics"
    - "git-github"
    - "node"
    - "claudinite-lifecycle"
    - id: "packs"
      source: "local"
checks:
  rules:
    claudinite-isolation: "off"
  accept:
    - rule: no-scheduled-fleet-executor
      path: .github/workflows/promote-packs.yml
      reason: "the daily pack promotion is the canon's release machinery, not fleet work"
    - rule: flat-declarations-current
      path: .claudinite/cache/tasks.GENERATED.json
      reason: "a canon task added under packs/ reaches the flat file only once its pack version is vendored; the check reads packs/ anyway (ClaudiniteEngine #376). Drop this once the fix reaches the pin"
    - rule: provenance-integrity
      path: packs/basics/provenance/ci-performance.md
      reason: "an entry kind outside the vocabulary, written before the check reached the shelf (#94)"
    - rule: provenance-integrity
      path: packs/cloudflare-site/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/git-github/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/github-pages/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/public-website/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
tasks:
  merge:
    "engine/update": "merge-safe-changes"
  frequency:
    "engine/update": "weekly"
