name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Node tests
        run: node --test $(git ls-files '*.test.mjs')

  # The pull-request half of "a version is published once": a pack whose shipped content changed
  # under a version already on `vendored` fails here, before the merge; release-packs' publish job
  # refuses the same thing after it. No secrets, so a fork's pull request runs it too.
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world
  release-plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Every changed pack carries a new version
        run: node tools/release/release.mjs plan --content --remote origin
      - name: The pack directory is current with the manifests and the catalog
        run: node tools/directory/render.mjs --check --remote origin
