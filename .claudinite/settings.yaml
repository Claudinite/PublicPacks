engine:
  channel: "staging"
  version: "1.61013.2"
  manifest: "sha512-Tb+shTgyAjeKLZn7FmzveZ6wliSye3SLoMfQuDdDfuO/HH9JMdtoZU5Vq9zHFmOG1ALmYoiAVl47Jyf3CWZYRw=="
packs:
  channel: "canary"
  declared:
    - "basics"
    - "git-github"
    - "node"
    - "claudinite-lifecycle"
    - id: "packs"
      source: "local"
checks:
  accept:
    - rule: claudinite-isolation
      path: packs/
      reason: "the shelf's packs are Claudinite packs: their prose, checks and tasks name .claudinite/ paths by design"
    - rule: claudinite-isolation
      path: tools/
      reason: "the release, vendoring and test tools build and read member trees"
    - rule: no-scheduled-fleet-executor
      path: .github/workflows/promote-packs.yml
      reason: "the daily pack promotion is the canon's release machinery, not fleet work"
    - rule: runnable-doc-commands
      path: packs/claudinite-growth/
      reason: "stale copy of a pack the engine now carries; the copy is being removed from this shelf"
    - rule: runnable-doc-commands
      path: packs/claudinite-lifecycle/
      reason: "stale copy of a pack the engine now carries; the copy is being removed from this shelf"
    - rule: provenance-integrity
      path: packs/claudinite-growth/
      reason: "stale copy of a pack the engine now carries; the copy is being removed from this shelf"
    - rule: provenance-integrity
      path: packs/claudinite-lifecycle/
      reason: "stale copy of a pack the engine now carries; the copy is being removed from this shelf"
    - rule: provenance-integrity
      path: packs/basics/provenance/ci-performance.md
      reason: "an entry kind outside the vocabulary, written before the check reached the shelf (#94)"
    - rule: provenance-integrity
      path: packs/cloudflare-site/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/git-github/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/github-pages/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
    - rule: provenance-integrity
      path: packs/public-website/pack.json
      reason: "the pack file's last entry retired a part, not the pack (#94)"
